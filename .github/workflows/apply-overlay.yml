# .github/workflows/apply-overlay.yml
# Uso UNICO: descompacta o invasion-merged.zip (na raiz do repo) por cima do codigo,
# faz commit e remove o zip. Roda sozinho quando o zip e enviado ao branch invasion.
name: Apply overlay zip

on:
  push:
    branches: [ invasion ]
    paths: [ 'invasion-merged.zip' ]
  workflow_dispatch:

# Precisa escrever no repo so para fazer o commit.
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: invasion
          submodules: recursive
      - name: Unzip over the tree
        run: |
          if [ ! -f invasion-merged.zip ]; then echo "Sem zip na raiz, nada a fazer."; exit 0; fi
          unzip -o invasion-merged.zip
          rm invasion-merged.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nada para commitar."; exit 0; }
          git commit -m "Merge HL: Invasion mod code into hlsdk-portable (Android port)"
          git push origin HEAD:invasion
          
