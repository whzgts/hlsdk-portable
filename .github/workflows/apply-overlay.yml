# .github/workflows/apply-overlay.yml
# Uso UNICO: descompacta o arquivo invasion-merged.zip (que voce subiu na raiz do repo)
# por cima do codigo, faz commit e remove o zip. Depois pode apagar este workflow.
name: Apply overlay zip

on:
  workflow_dispatch:

# Precisa escrever no repo so para fazer o commit. (O workflow android-build.yml continua read-only.)
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Unzip over the tree
        run: |
          test -f invasion-merged.zip || { echo "invasion-merged.zip nao esta na raiz do repo"; exit 1; }
          unzip -o invasion-merged.zip
          rm invasion-merged.zip
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Merge HL: Invasion mod code into hlsdk-portable (Android port)"
          git push
