# .github/workflows/android-build.yml
#
# Builds the mod's client + server libraries for Android (Xash3D FWGS) and,
# optionally, an APK from the hlsdk-portable "android/" Gradle project.
#
# Assumed repo layout: a fork of FWGS/hlsdk-portable (branch with the HL: Invasion
# code on top), cloned WITH submodules (freevgui lives in a submodule).
# CMake options are the ones hlsdk-portable documents; unknown -D options are
# only reported as "not used" by CMake, so adjust them if your fork differs.

name: Android build

on:
  push:
    branches: [ invasion, main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Also build an APK with the android/ Gradle project"
        type: boolean
        default: false

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

env:
  ANDROID_PLATFORM: android-21
  BUILD_TYPE: Release

jobs:
  libs:
    name: Libs (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, armeabi-v7a ]   # add x86_64 / x86 for emulators
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive            # needed for freevgui

      # Uses the NDK already installed on GitHub's runner image,
      # so no third-party action touches the build.
      - name: Locate NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          test -f "$NDK/build/cmake/android.toolchain.cmake" || { echo "NDK not found"; exit 1; }
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${{ matrix.abi }}" \
            -DANDROID_PLATFORM="$ANDROID_PLATFORM" \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DGOLDSOURCE_SUPPORT=OFF \
            -DCMAKE_C_FLAGS=-g1 -DCMAKE_CXX_FLAGS=-g1   # line info only in the symbols artifact (libs are stripped below)

      - name: Build
        run: |
          # Full log goes to build.log; the shell stops here if the build fails (pipefail).
          cmake --build build --parallel 2>&1 | tee build.log

      # On failure: show ONLY the real problems (not the thousands of warning lines).
      - name: Show errors (only if the build failed)
        if: failure()
        run: |
          {
            echo "### Erros do build (${{ matrix.abi }})"
            echo '```'
            grep -nE "error:|undefined symbol|undefined reference|FAILED:|fatal error" build.log | grep -v "Werror=" | head -60 || true
            echo '```'
            echo "Log completo: baixe o artifact build-log-${{ matrix.abi }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "error:|undefined symbol|fatal error" build.log | head -10 | while IFS= read -r l; do echo "::error::${l:0:300}"; done || true

      - name: Upload build log (only if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.abi }}
          path: build.log
          if-no-files-found: ignore

      - name: Collect and strip libraries
        run: |
          mkdir -p "out/${{ matrix.abi }}"
          # Take every .so CMake produced, whatever the target is called.
          find build -name '*.so' -not -path '*/CMakeFiles/*' -exec cp -v {} "out/${{ matrix.abi }}/" \;
          # Keep an unstripped copy: needed to translate crash-log offsets (see resolve-crash.yml).
          mkdir -p "symbols/${{ matrix.abi }}"
          cp -v "out/${{ matrix.abi }}"/*.so "symbols/${{ matrix.abi }}/"
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded "out/${{ matrix.abi }}"/*.so
          ls -l "out/${{ matrix.abi }}"
          # Sanity check: the server lib must export the entry points the engine looks up.
          "$NDK"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D --defined-only "out/${{ matrix.abi }}"/*.so \
            | grep -E 'GiveFnptrsToDll|GetEntityAPI|Initialize|GetClientDLLAPI|HUD_Init' || true

      - uses: actions/upload-artifact@v4
        with:
          name: invasion-libs-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/*.so
          if-no-files-found: error

      # Unstripped libs, only used to decode invasion_crash.log offsets. Same run id as the libs above.
      - uses: actions/upload-artifact@v4
        with:
          name: invasion-symbols-${{ matrix.abi }}
          path: symbols/${{ matrix.abi }}/*.so
          retention-days: 30
          if-no-files-found: error

  apk:
    name: APK (debug-signed)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: invasion-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
